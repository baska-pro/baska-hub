name: Sync BASKA Catalog

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Stage and verify a harmless catalog change without updating main"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'registry/overrides.json'
      - 'registry/assets.json'
      - 'scripts/sync_repositories.py'
      - '.github/workflows/sync-repositories.yml'

permissions:
  contents: write
  actions: write
  checks: read

concurrency:
  group: baska-public-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build public catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_repositories.py
      - name: Validate generated catalog
        run: |
          python3 -m json.tool registry/catalog.json >/dev/null
          python3 -m json.tool registry/repo-sync.json >/dev/null
          python3 -m json.tool manifest.json >/dev/null
          python3 scripts/audit_catalog.py
          python3 -m py_compile bin/baska scripts/sync_repositories.py
          bash -n scripts/publish_catalog_safely.sh
      - name: Stage, test and publish catalog delta
        env:
          GH_TOKEN: ${{ github.token }}
          BASKA_SYNC_DRY_RUN: ${{ inputs.dry_run || false }}
        run: bash scripts/publish_catalog_safely.sh
