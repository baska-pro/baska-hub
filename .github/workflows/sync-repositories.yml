name: Sync BASKA Repositories

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: baska-repository-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync repositories into registry
        env:
          BASKA_GH_PAT: ${{ secrets.BASKA_GH_PAT }}
        run: python3 scripts/sync_repositories.py

      - name: Validate generated files
        run: |
          python3 -m json.tool manifest.json >/dev/null
          python3 -m json.tool registry/repo-sync.json >/dev/null
          sh -n bin/baska

      - name: Commit catalog changes
        run: |
          if git diff --quiet -- registry/packages.tsv registry/repo-sync.json manifest.json; then
            echo 'Catalog already current.'
            exit 0
          fi
          git config user.name 'baska-hub-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/packages.tsv registry/repo-sync.json manifest.json
          git commit -m 'chore: auto-sync repository catalog'
          git push
