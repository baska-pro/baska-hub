name: Publish BASKA to PyPI

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'baska_tui.py'
      - 'bin/baska'
      - 'bin/baska-core'
      - '.github/workflows/publish-pypi.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-baska-pypi
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: meta
        name: Check package version on PyPI
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          import urllib.error
          import urllib.request

          with open('pyproject.toml', 'rb') as fh:
              version = tomllib.load(fh)['project']['version']

          exists = False
          url = f'https://pypi.org/pypi/baska/{version}/json'
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  json.load(response)
              exists = True
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              print(f'version={version}', file=out)
              print(f"publish={'false' if exists else 'true'}", file=out)

          print(f'BASKA version: {version}')
          print('PyPI status:', 'already published' if exists else 'new version, publish required')
          PY

  build:
    needs: version-check
    if: needs.version-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Validate package metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Smoke test wheel
        run: |
          python -m venv /tmp/baska-test
          /tmp/baska-test/bin/pip install dist/*.whl
          /tmp/baska-test/bin/baska version
          /tmp/baska-test/bin/baska-core version
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-dist-${{ needs.version-check.outputs.version }}
          path: dist/

  publish:
    needs: [version-check, build]
    if: needs.version-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/baska/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-dist-${{ needs.version-check.outputs.version }}
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
