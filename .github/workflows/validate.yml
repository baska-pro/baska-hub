name: Validate Hub

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          sh -n install.sh
          sh -n bin/baska
          find recipes -type f -name '*.sh' -print0 | xargs -0 -r -n1 sh -n

      - name: Validate JSON
        run: |
          python3 -m json.tool manifest.json >/dev/null
          python3 -m json.tool apps/android/kuisingo/package.json >/dev/null

      - name: Validate registry
        run: |
          python3 - <<'PY'
          import csv, json, pathlib, re

          root = pathlib.Path('.')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          with (root / 'registry/packages.tsv').open(encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f, delimiter='\t'))

          expected = {'id','slug','aliases','name','category','type','version','platforms','source','action','sha256','description'}
          if not rows:
              raise SystemExit('registry kosong')
          if set(rows[0]) != expected:
              raise SystemExit(f'kolom registry tidak sesuai: {set(rows[0])}')

          ids = [r['id'] for r in rows]
          slugs = [r['slug'] for r in rows]
          if len(ids) != len(set(ids)):
              raise SystemExit('ID registry duplikat')
          if len(slugs) != len(set(slugs)):
              raise SystemExit('slug registry duplikat')
          for package_id in ids:
              if not re.fullmatch(r'\d{5}', package_id):
                  raise SystemExit(f'ID harus 5 digit: {package_id}')

          manifest_packages = manifest.get('packages', [])
          manifest_ids = [p['id'] for p in manifest_packages]
          if set(ids) != set(manifest_ids):
              raise SystemExit('ID registry dan manifest tidak sinkron')

          for row in rows:
              action = row['action']
              source = row['source']
              if action.startswith('recipe:'):
                  recipe = root / action.split(':', 1)[1]
                  if not recipe.is_file():
                      raise SystemExit(f'recipe tidak ditemukan: {recipe}')
              if not source.startswith(('https://', 'http://')):
                  local_path = root / source
                  if not local_path.exists():
                      raise SystemExit(f'source lokal tidak ditemukan: {source}')

          print(f'OK: {len(rows)} paket tervalidasi')
          PY
