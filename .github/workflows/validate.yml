name: Validate BASKA Hub
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          sh -n install.sh
          python3 -m py_compile bin/baska baska_help.py baska_tui_v2.py baska_core_v2.py baska_self_update.py scripts/sync_repositories.py scripts/audit_catalog.py
          find recipes -type f -name '*.sh' -print0 | xargs -0 -r -n1 sh -n
      - name: JSON checks
        run: |
          python3 -m json.tool manifest.json >/dev/null
          python3 -m json.tool registry/catalog.json >/dev/null
          python3 -m json.tool registry/repo-sync.json >/dev/null
          python3 -m json.tool registry/overrides.json >/dev/null
          python3 -m json.tool registry/assets.json >/dev/null
          python3 -m json.tool registry/collections.json >/dev/null
      - name: Registry and installer audit
        run: |
          python3 scripts/audit_catalog.py
          python3 - <<'PY'
          import csv,json,pathlib,re
          root=pathlib.Path('.');catalog=json.loads((root/'registry/catalog.json').read_text());packages=catalog['packages'];ids=[p['id'] for p in packages];slugs=[p['slug'] for p in packages]
          assert len(ids)==len(set(ids));assert len(slugs)==len(set(slugs))
          for p in packages:
              assert re.fullmatch(r'(?:\d{5}|A\d{5})',p['id']);assert p.get('visibility')!='private'
          state=json.loads((root/'registry/repo-sync.json').read_text());raw=json.dumps(state)
          assert 'Arsip-Script' not in raw and '/oracle-cloud' not in raw
          with (root/'registry/packages.tsv').open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f,delimiter='\t'))
          assert {r['id'] for r in rows}==set(ids)
          print(f'OK: {len(packages)} public packages')
          PY
      - name: Public metadata checks
        run: |
          test -f LICENSE
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f .github/ISSUE_TEMPLATE/bug_report.yml
          test -f .github/ISSUE_TEMPLATE/feature_request.yml
          test -f .github/pull_request_template.md
          python3 - <<'PY'
          import pathlib,tomllib
          meta=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          assert meta['name']=='baska'
          assert meta['license']=='MIT'
          assert meta['version']
          assert 'baska_self_update' in tomllib.loads(pathlib.Path('pyproject.toml').read_text())['tool']['setuptools']['py-modules']
          print('Package metadata OK:',meta['version'])
          PY
      - name: Self-update unit smoke
        run: |
          python3 - <<'PY'
          import baska_self_update as u
          assert u.update_available('1.2.2','1.3.0')
          assert not u.update_available('1.3.0','1.3.0')
          method,cmd=u.detect_method()
          assert method in {'pip','pipx'} and cmd
          print('Self-update manager OK:',method)
          PY
      - name: CLI smoke test
        run: |
          python3 bin/baska version
          python3 bin/baska --help >/dev/null
          python3 bin/baska help install >/dev/null
          python3 bin/baska help upgrade >/dev/null
          python3 bin/baska upgrade --help >/dev/null
          python3 bin/baska install --help >/dev/null
          BASKA_HOME="$RUNNER_TEMP/baska-test" python3 bin/baska doctor
