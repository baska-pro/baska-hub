name: Validate BASKA Hub
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          sh -n install.sh
          python3 -m py_compile bin/baska scripts/sync_repositories.py
          find recipes -type f -name '*.sh' -print0 | xargs -0 -r -n1 sh -n
      - name: JSON checks
        run: |
          python3 -m json.tool manifest.json >/dev/null
          python3 -m json.tool registry/catalog.json >/dev/null
          python3 -m json.tool registry/repo-sync.json >/dev/null
          python3 -m json.tool registry/overrides.json >/dev/null
          python3 -m json.tool registry/assets.json >/dev/null
          python3 -m json.tool registry/collections.json >/dev/null
      - name: Registry policy checks
        run: |
          python3 - <<'PY'
          import csv,json,pathlib,re
          root=pathlib.Path('.');catalog=json.loads((root/'registry/catalog.json').read_text());packages=catalog['packages'];ids=[p['id'] for p in packages];slugs=[p['slug'] for p in packages]
          assert len(ids)==len(set(ids));assert len(slugs)==len(set(slugs))
          for p in packages:
              assert re.fullmatch(r'(?:\d{5}|A\d{5})',p['id']);assert p.get('visibility')!='private'
          state=json.loads((root/'registry/repo-sync.json').read_text());raw=json.dumps(state)
          assert 'Arsip-Script' not in raw and '/oracle-cloud' not in raw
          with (root/'registry/packages.tsv').open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f,delimiter='\t'))
          assert {r['id'] for r in rows}==set(ids)
          print(f'OK: {len(packages)} public packages')
          PY
      - name: CLI smoke test
        run: |
          python3 bin/baska version
          BASKA_HOME="$RUNNER_TEMP/baska-test" python3 bin/baska doctor
