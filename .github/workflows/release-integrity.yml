name: Release BASKA CLI
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build distribution archive
        run: |
          mkdir -p dist
          tar -czf "dist/baska-hub-${GITHUB_REF_NAME}.tar.gz" bin/baska install.sh manifest.json registry docs README.md
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --generate-notes --title "BASKA Hub $GITHUB_REF_NAME"
