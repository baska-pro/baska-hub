name: Release BASKA CLI

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build distribution archive
        run: |
          mkdir -p dist
          tar -czf "dist/baska-hub-${GITHUB_REF_NAME}.tar.gz" \
            bin/baska \
            bin/baska-core \
            baska_help.py \
            baska_tui_v2.py \
            baska_simple_ui.py \
            baska_core_v2.py \
            baska_self_update.py \
            install.sh \
            pyproject.toml \
            manifest.json \
            registry \
            recipes \
            docs \
            README.md \
            LICENSE \
            SECURITY.md \
            CONTRIBUTING.md
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refreshing assets."
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.tar.gz dist/SHA256SUMS \
              --generate-notes \
              --title "BASKA Hub $GITHUB_REF_NAME"
          fi
