<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BASKA Hub Catalog</title><style>:root{color-scheme:dark;--bg:#0b0d10;--panel:#13171c;--line:#242a31;--muted:#96a0ab;--text:#eef2f6;--accent:#5eead4}*{box-sizing:border-box}body{margin:0;font:14px/1.55 system-ui,sans-serif;background:var(--bg);color:var(--text)}main{max-width:1180px;margin:auto;padding:32px 18px 80px}.top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}h1{font-size:32px;margin:0}.sub{color:var(--muted);margin-top:6px}.pill{border:1px solid var(--line);padding:7px 10px;border-radius:999px;color:var(--muted)}.controls{display:grid;grid-template-columns:1fr 190px;gap:10px;margin:28px 0 16px}input,select{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.id{font-family:ui-monospace,monospace;color:var(--accent);font-weight:700}h2{font-size:17px;margin:8px 0}.meta{color:var(--muted);font-size:12px}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}.tag{border:1px solid var(--line);border-radius:999px;padding:2px 7px;color:var(--muted);font-size:11px}code{display:block;background:#090b0d;border:1px solid var(--line);border-radius:8px;padding:9px;overflow:auto;color:#c4f1ea}.empty{text-align:center;color:var(--muted);padding:50px}footer{margin-top:36px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}@media(max-width:600px){.controls{grid-template-columns:1fr}h1{font-size:26px}}</style></head><body><main><div class="top"><div><h1>BASKA Hub</h1><div class="sub">Public repository & package catalog</div></div><div class="pill" id="count">Loading…</div></div><div class="controls"><input id="q" placeholder="Cari ID, repo, tag, bahasa…"><select id="platform"><option value="">Semua platform</option><option>windows</option><option>linux</option><option>termux</option><option>all</option></select></div><div class="grid" id="grid"></div><footer>Private repositories are intentionally excluded. Connect them locally with <code>baska init</code>.</footer></main><script>const raw='https://raw.githubusercontent.com/baska-pro/baska-hub/main/registry/catalog.json';let packages=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){const q=document.querySelector('#q').value.toLowerCase(),pf=document.querySelector('#platform').value;const out=packages.filter(p=>{const text=[p.id,p.slug,p.name,p.description,p.language,...(p.tags||[])].join(' ').toLowerCase();return(!q||text.includes(q))&&(!pf||(p.platforms||[]).includes(pf))});document.querySelector('#count').textContent=`${out.length} public packages`;document.querySelector('#grid').innerHTML=out.length?out.map(p=>`<article class="card"><div class="row"><span class="id">${esc(p.id)}</span><span class="meta">${esc(p.status||'ready')}</span></div><h2>${esc(p.name||p.slug)}</h2><div class="meta">${esc((p.platforms||[]).join(', '))}${p.language?' · '+esc(p.language):''}${p.version?' · '+esc(p.version):''}</div><p>${esc(p.description||'')}</p><div class="tags">${(p.tags||[]).slice(0,8).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><code>baska install ${esc(p.slug)}</code></article>`).join(''):'<div class="empty">Tidak ada hasil.</div>'}fetch(raw).then(r=>r.json()).then(j=>{packages=j.packages||[];render()}).catch(()=>{document.querySelector('#grid').innerHTML='<div class="empty">Catalog gagal dimuat.</div>'});document.querySelector('#q').addEventListener('input',render);document.querySelector('#platform').addEventListener('change',render);</script></body></html>
