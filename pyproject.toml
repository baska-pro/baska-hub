[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baska"
version = "1.3.0"
description = "Interactive package and GitHub repository manager for Termux, Linux and Windows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Lathif Baska"}]
keywords = ["cli", "package-manager", "github", "termux", "linux", "windows", "repository-manager", "tui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: System :: Software Distribution"
]

[project.urls]
Homepage = "https://github.com/baska-pro/baska-hub"
Repository = "https://github.com/baska-pro/baska-hub"
Issues = "https://github.com/baska-pro/baska-hub/issues"
Documentation = "https://github.com/baska-pro/baska-hub/tree/main/docs"
Catalog = "https://baska-pro.github.io/baska-hub/"

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=6"]

[tool.setuptools]
py-modules = ["baska_help", "baska_tui_v2", "baska_core_v2", "baska_self_update"]
script-files = ["bin/baska", "bin/baska-core"]
