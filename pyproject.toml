[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baska"
version = "1.1.0"
description = "BASKA Hub interactive package and repository manager"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["cli", "package-manager", "github", "termux", "linux", "windows", "repository-manager", "tui"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: System :: Software Distribution"
]

[project.urls]
Homepage = "https://github.com/baska-pro/baska-hub"
Repository = "https://github.com/baska-pro/baska-hub"
Issues = "https://github.com/baska-pro/baska-hub/issues"
Catalog = "https://baska-pro.github.io/baska-hub/"

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=6"]

[tool.setuptools]
py-modules = ["baska_tui"]
script-files = ["bin/baska", "bin/baska-core"]
